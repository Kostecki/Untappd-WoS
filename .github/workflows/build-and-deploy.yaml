name: Create and deploy application

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: kostecki/wheel-of-styles

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get the latest commit hash and message
        id: git_info
        run: |
          LATEST_COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          LATEST_COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          echo "LATEST_COMMIT_HASH=$LATEST_COMMIT_HASH" >> "$GITHUB_ENV"
          echo "LATEST_COMMIT_MESSAGE=$LATEST_COMMIT_MESSAGE" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1

      - name: Use pnpm
        uses: pnpm/action-setup@v6

      - name: Detect pnpm store path
        id: pnpm_store_path
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm modules
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.pnpm_store_path.outputs.path }}
            ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install node modules
        run: pnpm install

      - name: Build the application
        run: pnpm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Extract metadata (tags and labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Login to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            LATEST_COMMIT_HASH=${{ env.LATEST_COMMIT_HASH }}
            LATEST_COMMIT_MESSAGE=${{ env.LATEST_COMMIT_MESSAGE }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push_image
    if: github.ref == 'refs/heads/master'

    permissions:
      id-token: write

    steps:
      - name: Deploy via Komodo
        uses: Kostecki/shared-actions/.github/actions/deploy-komodo@main
        with:
          ts-oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          ts-host: ${{ vars.TS_HOST }}
          komodo-port: ${{ vars.KOMODO_PORT }}
          komodo-api-key: ${{ secrets.KOMODO_API_KEY }}
          komodo-api-secret: ${{ secrets.KOMODO_API_SECRET }}
          komodo-stack-id: ${{ vars.KOMODO_STACK_ID }}
