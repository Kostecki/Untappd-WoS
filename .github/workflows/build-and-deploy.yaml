name: Create and deploy application

on:
  push:
    branches:
      - main
  # Checks and a test image build; nothing is pushed or deployed
  pull_request:
    branches:
      - main
  workflow_dispatch:

# One run per PR or branch at a time. A new push to a PR cancels its running
# check; on main runs queue instead, so deploys finish in order and only the
# newest waiting run is kept
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build-and-push_image:
    name: Build image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: kostecki/wheel-of-styles

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Get the latest commit hash and message
        id: git_info
        run: |
          LATEST_COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          LATEST_COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          echo "LATEST_COMMIT_HASH=$LATEST_COMMIT_HASH" >> "$GITHUB_ENV"
          echo "LATEST_COMMIT_MESSAGE=$LATEST_COMMIT_MESSAGE" >> "$GITHUB_ENV"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the application
        run: pnpm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Extract metadata (tags and labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Login to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            LATEST_COMMIT_HASH=${{ env.LATEST_COMMIT_HASH }}
            LATEST_COMMIT_MESSAGE=${{ env.LATEST_COMMIT_MESSAGE }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          # Pull requests only check that the image builds
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push_image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write

    steps:
      - name: Deploy via Komodo
        uses: Kostecki/shared-actions/.github/actions/deploy-komodo@main
        with:
          ts-oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          ts-host: ${{ vars.TS_HOST }}
          komodo-port: ${{ vars.KOMODO_PORT }}
          komodo-api-key: ${{ secrets.KOMODO_API_KEY }}
          komodo-api-secret: ${{ secrets.KOMODO_API_SECRET }}
          komodo-stack-id: ${{ vars.KOMODO_STACK_ID }}
