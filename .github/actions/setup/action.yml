name: Setup
description: Node (from mise.toml), pnpm (from packageManager) and the project's dependencies (cached)

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: jdx/mise-action@v5.2.7

    - name: Set up pnpm
      uses: pnpm/action-setup@v6.1.1
      with:
        cache: true

    - name: Install node modules
      shell: bash
      run: pnpm install --frozen-lockfile
